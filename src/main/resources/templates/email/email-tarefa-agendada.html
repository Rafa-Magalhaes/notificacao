<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lembrete de Tarefa</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: 'Source Sans 3', Helvetica, Arial, sans-serif;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #F4F9FF;
            border-radius: 0 0 30px 30px;
        }
        .header {
            background-color: #F4F9FF;
            padding: 40px 40px 20px 40px;
            text-align: center;
        }
        .header h1 {
            color: #1D3C6B;
            font-size: 26px;
            font-weight: 600;
            margin: 0 0 10px 0;
        }
        .content {
            padding: 0 40px 40px 40px;
            color: #1D3C6B;
            font-size: 17px;
            line-height: 26px;
        }
        .tarefa-box {
            background-color: #FFF8E8;
            border-radius: 14px;
            padding: 24px;
            margin: 25px 0;
            color: #484234;
        }
        .tarefa-box h2 {
            margin: 0 0 12px 0;
            color: #1D3C6B;
            font-size: 20px;
        }
        .info-label {
            font-weight: 600;
            color: #1D3C6B;
        }
        .footer {
            padding: 20px 40px;
            text-align: center;
            color: #6a7f9e;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="container">

    <!-- Cabeçalho -->
    <div class="header">
        <h1>Olá, <span th:text="${nome}">Usuário</span>! 👋</h1>
        <p style="font-size: 17px; color: #1D3C6B; margin: 0;">
            Você tem uma tarefa agendada
        </p>
    </div>

    <!-- Conteúdo -->
    <div class="content">

        <div class="tarefa-box">
            <h2 th:text="${titulo}">Título da Tarefa</h2>

            <p th:if="${descricao != null and !descricao.isEmpty()}"
               th:text="${descricao}">
                Descrição da tarefa
            </p>

            <p style="margin-top: 20px;">
                <span class="info-label">Data e Hora:</span><br>
                <span th:text="${#temporals.format(dataHora, 'dd/MM/yyyy HH:mm')}">
                    01/01/2026 10:00
                </span>
            </p>
        </div>

        <p style="text-align: center; margin-top: 30px;">
            Não esqueça de realizar sua tarefa no horário programado.
        </p>

    </div>

    <!-- Rodapé -->
    <div class="footer">
        <p>Este é um email automático. Por favor, não responda.</p>
        <p style="margin-top: 10px;">
            Atenciosamente,<br>
            <strong>Equipe da Plataforma</strong>
        </p>
    </div>

</div>
</body>
</html>
